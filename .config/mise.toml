[tools]
fzf = "0.74.1"
uv = "0.11.32"
jq = "1.8.2"
yq = "4.53.3"
sops = "3.13.3"
age = "1.3.1"
"npm:@github/copilot" = "1.0.75"
"dotnet:graphify-dotnet" = "0.7.0"
biome = "2.5.5"
node = "24.18.0"
dotnet = "10.0.302"

[hooks]
postinstall = [{ task = "gh-extensions" }, { task = "crew:update" }]

[settings]
idiomatic_version_file_enable_tools = ["dotnet"]
lockfile = true

[env]
CREW_PERSONAL_DIR = "{{config_root}}/../.crew/.crew"
# Local checkout of Blacklite/crew used to build the CLI from source
CREW_SRC = "{{config_root}}/.cache/crew-source"
# mise owns the `crew` command via PATH instead of a global `npm link`.
# The install task drops a single `crew` symlink here pointing at the built CLI.
CREW_BIN = "{{config_root}}/.cache/bin"
_.path = ["{{config_root}}/.cache/bin"]

[tasks.gh-mcp]
run = "gh extensions install shuymn/gh-mcp"

[tasks.gh-extensions]
run.tasks = ["gh-mcp"]

[tasks.update-agents]
description = "Update agents to the latest version"
run = [
    "cd {{config_root}}/ai && apm install --trust-transitive-mcp --force",
    "cd {{config_root}}/agents && apm install --trust-transitive-mcp --force",
    "apm install --global --trust-transitive-mcp --force",
]

[tasks."crew:install"]
description = "Clone Blacklite/crew, build, and expose the crew CLI via mise PATH"
run = """
set -euo pipefail
if [ -d "$CREW_SRC/.git" ]; then
  # build scripts bump version files in the checkout; discard before pulling
  git -C "$CREW_SRC" reset --hard
  git -C "$CREW_SRC" pull --ff-only
else
  git clone https://github.com/Blacklite/crew.git "$CREW_SRC"
fi
cd "$CREW_SRC"
npm install
npm run build
# Expose the built entry as `crew` on PATH — no global npm symlink.
entry="$CREW_SRC/packages/crew-cli/dist/cli-entry.js"
chmod +x "$entry"          # tsc emits 644; PATH exec needs the bit set
mkdir -p "$CREW_BIN"
ln -sfn "$entry" "$CREW_BIN/crew"
crew --version
"""

[tasks."crew:update"]
description = "Pull latest Blacklite/crew source and rebuild the crew CLI"
depends = ["crew:install"]

[tasks."crew:uninstall"]
description = "Remove the crew CLI symlink from mise PATH"
run = "rm -f \"$CREW_BIN/crew\""
