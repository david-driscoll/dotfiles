#:schema https://fnox.jdx.dev/schema.json

# To be fixed when the issue is resolved, see https://github.com/jdx/fnox/pull/818
[daemon]
enabled = true
idle_timeout = "8h"

[providers.age]
type = "age"
recipients = [
  "age150z0s36kl9vud8728c5e4zqq6nmyywekk76rwvjclcsfc8mrxuuqr0qfg6",
]
identity = { provider = "keychain", value = "age-key" }

[providers.op]
type = "1password"
vault = "Development"

[providers.openbao-equestria]
type = "vault"
address = "https://bao.equestria.driscoll.tech"
credential_command = "bao login -method=oidc -token-only"

[secrets]
GITHUB_TOKEN = { provider = "op", value = "GitHub Personal Access Token/token" }
SOPS_AGE_KEY_FILE = { provider = "op", value = "age.key/credential", as_file = true }
# FNOX_PROFILE = { default = "macos" }
