## Intel (x64) architecture-specific macOS config — symlinked to
## ~/.config/mise/config.macos-x64.toml. Layered on top of config.toml and
## config.macos.toml per mise's platform-file precedence
## (unix < macos < macos-arm64/macos-x64 < explicit MISE_ENV entries),
## confirmed against
## https://mise.jdx.dev/configuration/environments.html#platform-environments.
## Loaded automatically *only when MISE_AUTO_ENV=1 is set* — see config.toml's
## [settings] comment for why the auto_env setting alone isn't enough.
##
## Intel twin of config.macos-arm64.toml — same [bootstrap.user] entry, same
## reasoning (see that file's header for the full writeup: bootstrap phase
## ordering, why not the mise-tool shim, why the `opt/` path and not the
## top-level `bin/` path), just Homebrew's Intel prefix (/usr/local) instead
## of Apple Silicon's (/opt/homebrew). NOTE: unverified on real Intel
## hardware — David's daily driver is arm64 (confirmed via `uname -m` on the
## machine this PR was written on); this file is written from Homebrew's
## documented prefix convention, not tested on an actual Intel Mac. Flag if
## `/usr/local/opt/powershell/bin/pwsh` doesn't match reality on one.
##
## Reversibility: `chsh -s /bin/zsh` — see config.macos-arm64.toml for the
## full explanation (identical on both architectures).
[bootstrap.user]
login_shell = "/usr/local/opt/powershell/bin/pwsh"
