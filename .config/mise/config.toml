## GLOBAL mise config — symlinked to ~/.config/mise/config.toml on every machine.
## General-purpose CLI tool set + settings that apply everywhere, independent of
## which repo (if any) you're standing in. Repo-only tooling (crew tasks, hooks,
## env, apm/skillfile) lives in the repo-local `mise.toml` at the repo root —
## see that file's header for why the split exists.

[tools]
fzf = "0.74.1"
uv = "0.11.32"
jq = "1.8.2"
yq = "4.53.3"
sops = "3.13.3"
age = "1.3.1"
"npm:@github/copilot" = "1.0.75"
"dotnet:graphify-dotnet" = "0.7.0"
biome = "2.5.5"
node = "24.18.0"
dotnet = "10.0.302"

[settings]
# Merged in from the old root `mise.config.toml` (deleted by this split).
experimental = true
idiomatic_version_file_enable_tools = ["dotnet"]
lockfile = true
