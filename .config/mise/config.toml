## GLOBAL mise config — symlinked to ~/.config/mise/config.toml on every machine.
## General-purpose CLI tool set + settings that apply everywhere, independent of
## which repo (if any) you're standing in. Per review on #78, crew tooling
## (the crew CLI, apm, skillfile, and the env/hooks that support them) lives
## here rather than in the repo-local `mise.toml`, since the whole point is
## that `crew` works from any directory, not just inside this checkout.
## Repo-only tooling (currently just `update-agents`, which operates on this
## repo's own `ai/`/`agents/` apm projects) stays in the repo-local file —
## see that file's header for why.
##
## `{{config_root}}` for THIS file resolves to `$HOME` (mise's
## `MISE_GLOBAL_CONFIG_ROOT` default for the global config, regardless of
## this file itself being reached via a symlink from the dotfiles checkout —
## confirmed against https://mise.jdx.dev/configuration.html and
## https://github.com/jdx/mise/discussions/9100). So every `{{config_root}}`
## path below is `$HOME`-relative and stable no matter which directory you
## run mise from: CREW_PERSONAL_DIR -> ~/.crew/.crew, CREW_SRC ->
## ~/.cache/crew-source, CREW_BIN -> ~/.cache/bin.

[tools]
fzf = "0.74.1"
uv = "0.11.32"
jq = "1.8.2"
yq = "4.53.3"
sops = "3.13.3"
age = "1.3.1"
"npm:@github/copilot" = "1.0.75"
"dotnet:graphify-dotnet" = "0.7.0"
biome = "2.5.5"
node = "24.18.0"
dotnet = "10.0.302"
"github:microsoft/apm" = { version = "v0.26.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.0", bin = "skillfile" }

## Added by #66 (general-purpose CLI consolidation) — versions are each
## tool's current release as of this PR, resolved with `mise latest <tool>`
## against the live registry, not guessed. Every entry below was confirmed
## to exist in `mise registry` first; backends noted here so bumps/breakage
## are easy to trace back to the right upstream project.
gh = "2.96.0" # aqua:cli/cli
terraform = "1.15.8" # aqua:hashicorp/terraform
pulumi = "3.254.0" # aqua:pulumi/pulumi
kubectl = "1.36.3" # aqua:kubernetes/kubernetes/kubectl
helm = "4.2.3" # aqua:helm/helm
helmfile = "1.7.1" # aqua:helmfile/helmfile
kustomize = "5.8.1" # aqua:kubernetes-sigs/kustomize
kubeconform = "0.8.0" # aqua:yannh/kubeconform
# NOTE: the issue calls this tool "flux" but that shorthand isn't in mise's
# registry — the Flux CLI is registered as `flux2` (aqua:fluxcd/flux2). The
# installed binary is still named `flux`; only the mise config key differs
# from the issue text.
flux2 = "2.9.3" # aqua:fluxcd/flux2 -> installs the `flux` binary
# Same story as flux2: the issue calls this "go-task" but the registry
# shorthand is `task` (aqua:go-task/task); the binary is `task`.
task = "3.52.0" # aqua:go-task/task -> installs the `task` binary
starship = "1.26.0" # aqua:starship/starship
zoxide = "0.10.0" # aqua:ajeetdsouza/zoxide
direnv = "2.37.1" # aqua:direnv/direnv
eza = "0.23.5" # asdf:mise-plugins/mise-eza (no aqua backend for eza; cargo:eza is the other option)
talosctl = "1.13.7" # aqua:siderolabs/talos
talhelper = "3.1.15" # aqua:budimanjojo/talhelper
mkcert = "1.4.4" # aqua:FiloSottile/mkcert

# Added per review on #66: both are available as core mise tools (confirmed
# against https://mise-versions.jdx.dev/tools/powershell and
# https://mise-versions.jdx.dev/tools/python), so pin them here instead of
# installing via Homebrew. Replaces `brew "powershell/tap/powershell"` +
# `tap "powershell/tap"`, and the (duplicated) `brew "python"` entries, in
# setup/Brewfile.
powershell = "7.6.4"
python = "3.14.6"

[settings]
# Merged in from the old root `mise.config.toml` (deleted by the #63 split).
experimental = true
idiomatic_version_file_enable_tools = ["dotnet"]
lockfile = true
# `dotfiles.root` is the checkout itself: when a [dotfiles] entry omits
# `source`, mise mirrors the home-relative target under this root, e.g.
# `~/.zshrc` -> `~/dotfiles/.zshrc`.
dotfiles.root = "~/dotfiles"
# NOTE: this alone does NOT make the mac/linux-only config.*.toml files below
# load automatically — verified empirically (mise 2026.7.7) that the
# auto_env platform-file mechanism only activates when MISE_AUTO_ENV=1 is
# set as a real environment variable before mise reads any config; the
# setting here is inert on its own due to bootstrap ordering (mise has to
# know which extra files to read before it can read this file to learn that
# it should). `.zshrc`/`.bashrc` export MISE_AUTO_ENV=1 ahead of `mise
# activate` to make this work in practice. See the PR description for the
# doc citations and the reproduction.
auto_env = true

## [dotfiles] — entries that apply on every platform that reads THIS file as
## its global config. That used to mean mac + linux only, with Windows
## explicitly out of scope; as of #72, setup/setup.ps1 junctions
## ~/.config/mise to this same directory, so Windows now loads this exact
## table too (copy fallback for the file/symlink-each entries, since Windows
## file symlinks need elevation — see setup.ps1's own header comment).
## Nothing here is Windows-gated: ~/.zshrc, ~/.ssh, etc. all get created on
## Windows now, mostly harmlessly (unused by native pwsh, but real for Git
## Bash). macOS-only entries live in the sibling `config.macos.toml`, loaded
## automatically when MISE_AUTO_ENV=1 is set (see above; not set by
## setup.ps1, so this file's own Windows-agnostic entries are what Windows
## gets — no config.windows.toml exists yet); Linux/WSL-only entries live in
## `config.linux.toml`. mise has no per-entry `os =` field for [dotfiles]
## (only [tools] has that) — platform config-file layering is the
## documented alternative: https://mise.jdx.dev/configuration/environments.html#platform-environments
[dotfiles]
"~/.zshrc" = {}
"~/.zprofile" = {}
"~/.bashrc" = {}
"~/.bash_aliases" = {}
"~/.inputrc" = {}
# Whole-dir symlink would put host keys, known_hosts churn, and strict
# ssh perm requirements (700/600) behind a single link mise doesn't manage
# file-by-file. symlink-each keeps ~/.ssh a real directory — mise creates
# it if missing — and links only what's tracked here (authorized_keys,
# config, 1Password/config — known_hosts.old was also tracked here until
# #76 deleted it as stale cruft); anything ssh or another tool drops in
# later (host keys, a live known_hosts, control-master sockets) is left
# alone.
"~/.ssh" = { source = "ssh", mode = "symlink-each" }
"~/.config/starship.toml" = { source = "starship.toml" }
# Directory symlink on every platform — install.sh used to link the whole
# dir, setup/setup.sh linked just the one file; this repo's powershell/
# held both macos.ps1 and Microsoft.PowerShell_profile.ps1 until #69
# deleted macos.ps1 (dead UTF-16LE duplicate of profile.darwin.ps1, only
# ever referenced by the now-deleted setup-osx.sh) — plus a stray
# self-referential `powershell/powershell` symlink worth cleaning up
# separately — so the directory form is still the one that doesn't
# silently drop a file if another one shows up later.
"~/.config/powershell" = { source = "powershell" }
# `~/.apm/config.json` + `~/.apm/marketplaces.json`: the deleted
# `setup/setup-osx.sh` was the *only* script that ever symlinked these
# (#69) — meaning `apm`'s default_client and marketplace list were never
# actually wired up on a bootstrap-only machine, mac or otherwise. Not
# mac-specific (unlike setup-osx.sh's placement suggested): `apm` itself is
# a cross-platform `[tools]` entry above, so its config belongs in the
# cross-platform table too. Default (no `source =`) is correct here since
# the home-relative target already matches this repo's layout 1:1:
# `~/.apm/config.json` -> `{{dotfiles.root}}/.apm/config.json`. NOTE:
# `~/.apm/mise.toml` is deliberately NOT relinked here — #63 folded it into
# this repo's own root `mise.toml`, so there's no separate file left to
# point at (see that file's header).
"~/.apm/config.json" = {}
"~/.apm/marketplaces.json" = {}
# Commented out per review on #64: David doesn't generally set up gpg unless
# he needs it. Left in place (not deleted) so it's a one-line re-enable when
# that changes. Note this is gpg-agent.conf specifically — the 1Password SSH
# agent config (config.macos.toml's "~/.config/1Password/ssh/agent.toml"
# entry) is unrelated and stays active.
# "~/.gnupg/gpg-agent.conf" = { source = "gpg-agent.conf" }
# Removed per review on #64: apm already handles most of the AI skills
# management, so a separate mise-managed symlink for ~/.claude/rules and
# ~/.claude/skills is redundant for now.
# Committed git config (#65) — replaces the ~4 `git config --global` blocks
# that used to be scattered (and contradict each other) across install.sh,
# setup/setup.sh, setup/setup-osx.sh, and setup/setup.ps1. Per-OS overrides
# (1Password's SSH-signing program path) load via this file's own plain
# `[include] path = ~/.gitconfig.local` — see git/gitconfig's header and
# config.macos.toml/config.linux.toml below for the mechanism, since mise's
# [dotfiles] table itself has no per-entry `os =` field (same limitation
# noted above for the mac/linux-only entries).
"~/.gitconfig" = { source = "git/gitconfig" }

[hooks]
postinstall = [{ task = "gh-extensions" }, { task = "crew:update" }]

[env]
CREW_PERSONAL_DIR = "{{config_root}}/.crew/.crew"
# Local checkout of Blacklite/crew used to build the CLI from source
CREW_SRC = "{{config_root}}/.cache/crew-source"
# mise owns the `crew` command via PATH instead of a global `npm link`.
# The install task drops a single `crew` symlink here pointing at the built CLI.
CREW_BIN = "{{config_root}}/.cache/bin"
_.path = ["{{config_root}}/.cache/bin"]

# gh CLI extensions this repo wants everywhere `gh` itself is installed
# (#83). Single source of truth: previously duplicated across install.sh,
# setup/setup-osx.sh (deleted, #69), setup/setup.ps1 (rewritten, #72), and
# this task's own one-extension stub (`gh extensions install`, plural —
# not a valid `gh` subcommand). Design notes:
#
# - Idempotent via a pre-check against `gh extension list`, not `--force`.
#   `gh extension install --help` documents `--force` as "Force upgrade
#   extension, or ignore if latest already installed" — that phrasing only
#   makes sense if a bare re-install of an already-present extension is
#   NOT a no-op by default (confirmed by #73's spike; not independently
#   re-verified by actually installing, since `gh extension install` is
#   off-limits under this task's hard safety rules). Skipping extensions
#   already listed avoids both the unverified default-error path and an
#   unconditional network upgrade check on every single bootstrap run.
# - Auth-guarded: no-ops with a clear message (never hangs, never fails
#   the task) when `gh auth status` fails and neither GITHUB_TOKEN nor
#   GH_TOKEN is set — required so this never blocks unattended Codespaces/
#   Coder container builds. Never calls `gh auth login`.
# - Failure-isolated per extension: one unavailable/renamed extension is
#   caught and reported in the end-of-run summary, not allowed to abort
#   the other nine or fail this task (and therefore the `postinstall`
#   hook chain / `mise bootstrap`).
# - One script body covers macOS, Linux, AND Windows: written in
#   PowerShell and run via `shell = "pwsh -NoProfile -Command"` rather
#   than bash + a separate `run_windows`, because `pwsh` is already a
#   plain cross-platform `[tools]` entry in this exact file (see above) —
#   reusing it here avoids both non-portable bash-isms (macOS's default
#   `sh` and Debian/Ubuntu's default `sh` are different shells; `pipefail`
#   isn't POSIX) and the untested question of whether mise's shebang
#   parsing behaves the same for `run` and `run_windows`.
# - The script body lives in a real, checked-in, AST-parseable file
#   (`.config/mise/scripts/gh-extensions.ps1`) rather than inline here, per
#   review on #89. It's invoked via `$HOME`, not `{{config_root}}`: for
#   the *global* mise config (this file), `{{config_root}}` resolves to
#   `$HOME` itself (established in #63 — that's exactly why `brew:casks`,
#   which needs a real repo-relative path, had to move to the repo-local
#   `mise.toml` instead of living here), so a `{{config_root}}`-based path
#   here would silently mean `~/scripts/...`, not this repo's scripts
#   directory. `$HOME/.config/mise/scripts/...` works everywhere instead,
#   because every bootstrap script (install.sh, setup-macos.sh, setup.ps1)
#   symlinks/junctions `~/.config/mise` to `<repo>/.config/mise` *before*
#   running `mise bootstrap` — so this path is stable across every
#   machine regardless of where the repo itself was cloned (notably
#   Codespaces, which clones to `/workspaces/...`, not `~/dotfiles`). Mise
#   template variables were checked for a "directory of this config file"
#   variable that would avoid the `$HOME` indirection entirely — per
#   https://mise.jdx.dev/templates.html, no such variable exists;
#   `config_root` is the only config-relative one, and it's special-cased
#   to `$HOME` for the global config specifically, which is the whole
#   problem being routed around here.
[tasks.gh-extensions]
description = "Install this repo's gh CLI extensions (idempotent, auth-guarded, failure-isolated; #83)"
shell = "pwsh -NoProfile -Command"
run = '& "$HOME/.config/mise/scripts/gh-extensions.ps1"'

[tasks."crew:install"]
description = "Clone Blacklite/crew, build, and expose the crew CLI via mise PATH"
run = """
set -euo pipefail
if [ -d "$CREW_SRC/.git" ]; then
  # build scripts bump version files in the checkout; discard before pulling
  git -C "$CREW_SRC" reset --hard
  git -C "$CREW_SRC" pull --ff-only
else
  git clone https://github.com/Blacklite/crew.git "$CREW_SRC"
fi
cd "$CREW_SRC"
npm install
npm run build
# Expose the built entry as `crew` on PATH — no global npm symlink.
entry="$CREW_SRC/packages/crew-cli/dist/cli-entry.js"
chmod +x "$entry"          # tsc emits 644; PATH exec needs the bit set
mkdir -p "$CREW_BIN"
ln -sfn "$entry" "$CREW_BIN/crew"
crew --version
"""

[tasks."crew:update"]
description = "Pull latest Blacklite/crew source and rebuild the crew CLI"
depends = ["crew:install"]

[tasks."crew:uninstall"]
description = "Remove the crew CLI symlink from mise PATH"
run = "rm -f \"$CREW_BIN/crew\""
