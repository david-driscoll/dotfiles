[settings]
experimental = true
idiomatic_version_file_enable_tools = ["dotnet"]
lockfile = true
auto_env = true

[settings.dotfiles]
root = "~/dotfiles"

[settings.skills]
dir = ".agents/skills"
auto_sync = true
prune = true

[env]
# SOPS_AGE_KEY = "{{ env.FNOX_AGE_KEY }}"
# CREW_PERSONAL_DIR = "{{config_root}}/.crew/.crew"
# CREW_SRC = "{{config_root}}/.cache/crew-source"
# CREW_BIN = "{{config_root}}/.cache/bin"
# _.path = ["{{config_root}}/.cache/bin"]

[tools]
fnox = "v1.39.0"
go = "1.27.2"
hk = "2.5.0"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
fzf = "0.74.4"
uv = "0.12.24"
jq = "1.8.2"
yq = "4.54.1"
sops = "3.13.3"
age = "1.3.2"
# "npm:@github/copilot" = "1.0.88"
biome = "2.5.5"
node = "24.21.0"
dotnet = ["10.0.400", "8.0.425"]
"github:microsoft/apm" = { version = "v0.33.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.2", bin = "skillfile" }
gh = "2.102.0" # aqua:cli/cli
kubectl = "1.37.1" # aqua:kubernetes/kubernetes/kubectl
kustomize = "5.8.3" # aqua:kubernetes-sigs/kustomize
kubeconform = "0.8.0" # aqua:yannh/kubeconform
flux2 = "2.9.6" # aqua:fluxcd/flux2 -> installs the `flux` binary
starship = "1.26.0" # aqua:starship/starship
zoxide = "0.10.0" # aqua:ajeetdsouza/zoxide
mkcert = "1.4.4" # aqua:FiloSottile/mkcert
powershell = "7.6.6"
python = "3.15.0"
"pipx:graphifyy" = "0.9.82"
"dotnet:graphify-dotnet" = "0.7.0"

[dotfiles]
"~/.zshrc" = {}
"~/.zprofile" = {}
"~/.bashrc" = {}
"~/.bash_aliases" = {}
"~/.inputrc" = {}
"~/.config/starship.toml" = { source = "~/dotfiles/starship.toml" }
"~/.config/powershell" = { source = "~/dotfiles/powershell" }
"~/.apm/config.json" = {}
"~/.apm/marketplaces.json" = {}
"~/.gitconfig" = { source = "~/dotfiles/git/gitconfig" }
"~/.config/mise/config.toml" = { source = "~/dotfiles/.config/mise/config.toml" }
# The macOS platform layers have to be linked from HERE, not from their own
# [dotfiles]: mise only reads config.macos.toml once it is already in
# ~/.config/mise, so an entry inside it could never create its own link.
# `variants` keeps them off Linux/Windows homes (see install.sh's note that
# config.macos*.toml has no business there).
"~/.config/mise/config.macos.toml" = { source = "~/dotfiles/.config/mise/config.macos.toml", variants = [{ os = "macos" }] }
"~/.config/mise/config.macos-arm64.toml" = { source = "~/dotfiles/.config/mise/config.macos-arm64.toml", variants = [{ os = "macos" }] }
"~/.config/mise/scripts" = { source = "~/dotfiles/.config/mise/scripts", mode = "symlink-each" }
"~/.config/mcpmu/config.json" = { source = "~/dotfiles/mcpmu/config.json" }
# To be fixed when the issue is resolved, see https://github.com/jdx/fnox/pull/818
# "~/.config/fnox/config.toml" = { source = "~/dotfiles/.config/fnox/config.toml" }

[hooks]
postinstall = [{ task = "gh-extensions" }, { task = "az-extensions" }, { task = "hk:install-global" }]

[tasks.gh-extensions]
description = "Install this repo's gh CLI extensions (idempotent, auth-guarded, failure-isolated; #83, #96)"
shell = "pwsh -NoProfile -Command"
run = '''
$repoScript = Join-Path "{{config_root}}" ".config/mise/scripts/gh-extensions.ps1"
$homeScript = Join-Path $HOME ".config/mise/scripts/gh-extensions.ps1"
$script = @($repoScript, $homeScript) | Where-Object { Test-Path $_ } | Select-Object -First 1
if (-not $script) {
    Write-Warning "[gh-extensions] script not found at '$repoScript' or '$homeScript' -- skipping (has the dotfiles bootstrap symlink been created yet? see #96)"
    exit 0
}
& $script
'''

[tasks.az-extensions]
description = "Install this repo's az CLI extensions (idempotent, failure-isolated; #90, #96)"
shell = "pwsh -NoProfile -Command"
run = '''
$repoScript = Join-Path "{{config_root}}" ".config/mise/scripts/az-extensions.ps1"
$homeScript = Join-Path $HOME ".config/mise/scripts/az-extensions.ps1"
$script = @($repoScript, $homeScript) | Where-Object { Test-Path $_ } | Select-Object -First 1
if (-not $script) {
    Write-Warning "[az-extensions] script not found at '$repoScript' or '$homeScript' -- skipping (has the dotfiles bootstrap symlink been created yet? see #96)"
    exit 0
}
& $script
'''

[tasks."hk:install-global"]
description = "Enable hk globally through mise (requires Git 2.54+)"
shell = "pwsh -NoProfile -Command"
run = '''
$gitVersion = git --version
if ($LASTEXITCODE -ne 0 -or $gitVersion -notmatch 'git version (\d+)\.(\d+)') {
    throw "hk:install-global: cannot determine the Git version"
}
if ([version]"$($Matches[1]).$($Matches[2])" -lt [version]"2.54") {
    Write-Warning "hk:install-global: Git 2.54+ is required for global hk hooks ($gitVersion found); upgrade Git and run mise run hk:install-global."
} else {
    # ~/.gitconfig and ~/.gitconfig.local are tracked repo files, and hk writes
    # absolute, machine-specific mise paths, so redirect to the untracked file
    # git/gitconfig includes. Run from $HOME so a repo's hk.pkl doesn't narrow
    # the installed hook set.
    $hkGitConfig = Join-Path $HOME ".config/hk/gitconfig"
    New-Item -ItemType Directory -Force -Path (Split-Path $hkGitConfig) | Out-Null
    $env:GIT_CONFIG_GLOBAL = $hkGitConfig
    Push-Location $HOME
    try { hk install --global --mise } finally { Pop-Location }
    if ($LASTEXITCODE -ne 0) { throw "hk:install-global: installation failed" }
}
'''
