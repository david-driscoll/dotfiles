[settings]
experimental = true
idiomatic_version_file_enable_tools = ["dotnet"]
auto_env = true
otel.enabled = true

[settings.dotfiles]
root = "~/dotfiles"

[settings.skills]
dir = ".agents/skills"
auto_sync = true
prune = true

[secrets.fnox]

[env]
FNOX_CONFIG_DIR = "~/.config/fnox"
# SOPS_AGE_KEY = "{{ env.FNOX_AGE_KEY }}"
# CREW_PERSONAL_DIR = "{{config_root}}/.crew/.crew"
# CREW_SRC = "{{config_root}}/.cache/crew-source"
# CREW_BIN = "{{config_root}}/.cache/bin"
# _.path = ["{{config_root}}/.cache/bin"]

[tools]
fnox = "v1.50.0"
go = "1.27.4"
hk = "2.13.0"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
fzf = "0.75.0"
uv = "0.13.10"
jq = "1.8.2"
yq = "4.54.3"
sops = "3.13.3"
age = "1.3.2"
# "npm:@github/copilot" = "1.0.88"
biome = "2.5.5"
node = "26.13.1"
dotnet = ["10.0.400", "8.0.425"]
"github:microsoft/apm" = { version = "v0.38.1", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.3", bin = "skillfile" }
gh = "2.106.0" # aqua:cli/cli
kubectl = "1.37.3" # aqua:kubernetes/kubernetes/kubectl
kustomize = "5.8.3" # aqua:kubernetes-sigs/kustomize
kubeconform = "0.8.0" # aqua:yannh/kubeconform
flux2 = "2.10.1" # aqua:fluxcd/flux2 -> installs the `flux` binary
starship = "1.27.0" # aqua:starship/starship
zoxide = "0.10.0" # aqua:ajeetdsouza/zoxide
mkcert = "1.4.4" # aqua:FiloSottile/mkcert
powershell = "7.7.0"
python = "3.15.2"
# "pipx:graphifyy" = "0.9.112"
"dotnet:graphify-dotnet" = "0.7.0"
kubelogin = "1.36.4"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.services.mise-tool-update]
builtin = "tool-update"

[dotfiles]
"~/.zshrc" = {}
"~/.zprofile" = {}
"~/.bashrc" = {}
"~/.bash_aliases" = {}
"~/.inputrc" = {}
"~/.config/starship.toml" = { source = "~/dotfiles/starship.toml" }
"~/.config/powershell" = { source = "~/dotfiles/powershell" }
"~/.apm/config.json" = {}
"~/.apm/marketplaces.json" = {}
# "~/.apm/marketplaces.json" = { mode = "track" }
# "~/.apm/config.json" = { mode = "track" }
# Seeded once, then owned by the machine: `git config --global` writes land
# here, never in the repo. The shared config comes in through the include.
"~/.gitconfig" = { content = """
# Global git config for this machine only (untracked, seeded by mise).
# `git config --global` writes here. Keep the include first so values below
# override the shared ~/dotfiles/git/gitconfig.
[include]
	path = ~/dotfiles/git/gitconfig
""", create_if_missing = true }
# Per-OS overrides (windows / macos / linux / wsl), chosen by the template.
"~/.gitconfig.local" = { source = "~/dotfiles/git/gitconfig.local.tera", mode = "template" }
"~/.config/fnox/config.toml" = { source = "~/dotfiles/.config/fnox/config.toml" }
"~/.config/mise/config.toml" = { source = "~/dotfiles/.config/mise/config.toml" }
"~/.config/mise/config.macos.toml" = { source = "~/dotfiles/.config/mise/config.macos.toml", variants = [{ os = "macos" }] }
"~/.config/mise/config.macos-arm64.toml" = { source = "~/dotfiles/.config/mise/config.macos-arm64.toml", variants = [{ os = "macos" }] }
"~/.config/mise/scripts" = { source = "~/dotfiles/.config/mise/scripts", mode = "symlink-each" }
