[settings]
experimental = true
idiomatic_version_file_enable_tools = ["dotnet"]
auto_env = true
otel.enabled = true

[settings.dotfiles]
root = "~/dotfiles"

[settings.skills]
dir = ".agents/skills"
auto_sync = true
prune = true

[secrets.fnox]

[env]
FNOX_CONFIG_DIR = "~/.config/fnox"
# SOPS_AGE_KEY = "{{ env.FNOX_AGE_KEY }}"
# CREW_PERSONAL_DIR = "{{config_root}}/.crew/.crew"
# CREW_SRC = "{{config_root}}/.cache/crew-source"
# CREW_BIN = "{{config_root}}/.cache/bin"
# _.path = ["{{config_root}}/.cache/bin"]

[tools]
fnox = "v1.39.0"
go = "1.27.2"
hk = "2.5.0"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
fzf = "0.74.5"
uv = "0.12.24"
jq = "1.8.2"
yq = "4.54.1"
sops = "3.13.3"
age = "1.3.2"
# "npm:@github/copilot" = "1.0.88"
biome = "2.5.5"
node = "24.21.0"
dotnet = ["10.0.400", "8.0.425"]
"github:microsoft/apm" = { version = "v0.33.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.2", bin = "skillfile" }
gh = "2.102.0" # aqua:cli/cli
kubectl = "1.37.1" # aqua:kubernetes/kubernetes/kubectl
kustomize = "5.8.3" # aqua:kubernetes-sigs/kustomize
kubeconform = "0.8.0" # aqua:yannh/kubeconform
flux2 = "2.9.6" # aqua:fluxcd/flux2 -> installs the `flux` binary
starship = "1.26.0" # aqua:starship/starship
zoxide = "0.10.0" # aqua:ajeetdsouza/zoxide
mkcert = "1.4.4" # aqua:FiloSottile/mkcert
powershell = "7.6.7"
python = "3.14.8"
"pipx:graphifyy" = "0.9.92"
"dotnet:graphify-dotnet" = "0.7.0"
kubelogin = "1.36.4"

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.zshrc" = {}
"~/.zprofile" = {}
"~/.bashrc" = {}
"~/.bash_aliases" = {}
"~/.inputrc" = {}
"~/.config/starship.toml" = { source = "~/dotfiles/starship.toml" }
"~/.config/powershell" = { source = "~/dotfiles/powershell" }
"~/.apm/config.json" = {}
"~/.apm/marketplaces.json" = {}
# "~/.apm/marketplaces.json" = { mode = "track" }
# "~/.apm/config.json" = { mode = "track" }
"~/.gitconfig" = { source = "~/dotfiles/git/gitconfig" }
"~/.config/fnox/config.toml" = { source = "~/dotfiles/.config/fnox/config.toml" }
"~/.config/mise/config.toml" = { source = "~/dotfiles/.config/mise/config.toml" }
"~/.config/mise/config.macos.toml" = { source = "~/dotfiles/.config/mise/config.macos.toml", variants = [{ os = "macos" }] }
"~/.config/mise/config.macos-arm64.toml" = { source = "~/dotfiles/.config/mise/config.macos-arm64.toml", variants = [{ os = "macos" }] }
"~/.config/mise/scripts" = { source = "~/dotfiles/.config/mise/scripts", mode = "symlink-each" }
