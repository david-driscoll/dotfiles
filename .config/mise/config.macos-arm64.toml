## Apple Silicon (arm64) architecture-specific macOS config — symlinked to
## ~/.config/mise/config.macos-arm64.toml. Layered on top of config.toml and
## config.macos.toml per mise's platform-file precedence
## (unix < macos < macos-arm64/macos-x64 < explicit MISE_ENV entries),
## confirmed against
## https://mise.jdx.dev/configuration/environments.html#platform-environments.
## Loaded automatically *only when MISE_AUTO_ENV=1 is set* — see config.toml's
## [settings] comment for why the auto_env setting alone isn't enough.
##
## Exists solely to hold the arm64 half of [bootstrap.user] below. This is
## David's daily-driver architecture; config.macos-x64.toml is the Intel twin,
## kept for portability even though it's unverified on real Intel hardware.

## [bootstrap.user] — pwsh as login shell (#71, part of epic #61; revised
## 2026-11 when Homebrew removed the `powershell` cask this used to point at).
##
## Points at mise's own PowerShell install through the `latest` symlink mise
## keeps in its installs directory:
##   ~/.local/share/mise/installs/powershell/latest/pwsh
## That is the real binary, not a shim, so starting the login shell never runs
## mise. `latest` follows the newest installed version, so Renovate bumps of
## [tools].powershell in config.toml move the login shell with them, and
## `mise prune` removing old versions doesn't break it.
##
## Why this is safe now (the earlier objections, revisited):
##
## a. Bootstrap order: `user` still runs BEFORE `tools`
##    (https://mise.jdx.dev/bootstrap.html#run-order), and `user apply` fails
##    if the shell doesn't exist yet. setup/setup-macos.sh therefore runs
##    `mise bootstrap --skip user` first and `mise bootstrap user apply`
##    after — the order mise's own docs suggest for shells that are installed
##    later (https://mise.jdx.dev/bootstrap/shell.html). On a Mac that already
##    has mise's powershell installed, plain `mise bootstrap` works too.
##
## b. Shim fragility: not a shim (see above). It depends only on the install
##    directory existing, which `mise uninstall powershell --all` or deleting
##    ~/.local/share/mise would break. Recovery: set Terminal/Ghostty to open
##    /bin/zsh, then `chsh -s /bin/zsh`.
##
## c. .NET ownership: the aqua build is Microsoft's self-contained tarball (it
##    runs with an empty environment and no DOTNET_ROOT), so neither the
##    Homebrew `powershell` formula nor its `dotnet` dependency is needed.
##
## login_shell is a template (absolute path required, `~` is not expanded),
## hence {{env.HOME}}. mise adds it to /etc/shells (sudo prompt) and runs chsh
## (password prompt) the first time it applies.
##
## Reversibility: `chsh -s /bin/zsh`. zsh stays in /etc/shells and remains
## dotfiles-managed.
[bootstrap.user]
login_shell = "{{env.HOME}}/.local/share/mise/installs/powershell/latest/pwsh"
