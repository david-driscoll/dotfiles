## REPO-LOCAL mise config — NOT symlinked anywhere. Only active when your cwd is
## inside this checkout of dotfiles. Crew tooling, backend agent tools, and
## repo-only tasks/hooks/env live here. General-purpose CLI tools that belong on
## every machine live in the GLOBAL config: `.config/mise/config.toml` (symlinked
## to `~/.config/mise/config.toml` by the installers).
##
## `{{config_root}}` here resolves to this repo's root (this file's directory) —
## before the #63 split this file's tasks/env lived in `.config/mise.toml`, where
## `{{config_root}}` resolved to `.config/` instead. Two things changed as a
## result and were adjusted deliberately:
##   - CREW_PERSONAL_DIR dropped its `../` (was `{{config_root}}/../.crew/.crew`,
##     now `{{config_root}}/.crew/.crew`) so it still resolves to repo-root/.crew/.crew.
##   - CREW_SRC/CREW_BIN's on-disk location shifts from `.config/.cache/*` to
##     `.cache/*` at repo root. Harmless: `.cache/` is gitignored either way and
##     this is an ephemeral build cache with nothing to migrate.
##   - Bonus fix: `update-agents` used `cd {{config_root}}/ai` / `.../agents`,
##     which resolved to the nonexistent `.config/ai` / `.config/agents` and was
##     silently broken. Now that config_root is the repo root, it correctly
##     targets the real `ai/` and `agents/` directories.

[tools]
"github:microsoft/apm" = { version = "v0.26.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.0", bin = "skillfile" }

[hooks]
postinstall = [{ task = "gh-extensions" }, { task = "crew:update" }]

[env]
CREW_PERSONAL_DIR = "{{config_root}}/.crew/.crew"
# Local checkout of Blacklite/crew used to build the CLI from source
CREW_SRC = "{{config_root}}/.cache/crew-source"
# mise owns the `crew` command via PATH instead of a global `npm link`.
# The install task drops a single `crew` symlink here pointing at the built CLI.
CREW_BIN = "{{config_root}}/.cache/bin"
_.path = ["{{config_root}}/.cache/bin"]

[tasks.gh-mcp]
run = "gh extensions install shuymn/gh-mcp"

[tasks.gh-extensions]
run.tasks = ["gh-mcp"]

[tasks.update-agents]
description = "Update agents to the latest version"
run = [
    "cd {{config_root}}/ai && apm install --trust-transitive-mcp --force",
    "cd {{config_root}}/agents && apm install --trust-transitive-mcp --force",
    "apm install --global --trust-transitive-mcp --force",
]

[tasks."crew:install"]
description = "Clone Blacklite/crew, build, and expose the crew CLI via mise PATH"
run = """
set -euo pipefail
if [ -d "$CREW_SRC/.git" ]; then
  # build scripts bump version files in the checkout; discard before pulling
  git -C "$CREW_SRC" reset --hard
  git -C "$CREW_SRC" pull --ff-only
else
  git clone https://github.com/Blacklite/crew.git "$CREW_SRC"
fi
cd "$CREW_SRC"
npm install
npm run build
# Expose the built entry as `crew` on PATH — no global npm symlink.
entry="$CREW_SRC/packages/crew-cli/dist/cli-entry.js"
chmod +x "$entry"          # tsc emits 644; PATH exec needs the bit set
mkdir -p "$CREW_BIN"
ln -sfn "$entry" "$CREW_BIN/crew"
crew --version
"""

[tasks."crew:update"]
description = "Pull latest Blacklite/crew source and rebuild the crew CLI"
depends = ["crew:install"]

[tasks."crew:uninstall"]
description = "Remove the crew CLI symlink from mise PATH"
run = "rm -f \"$CREW_BIN/crew\""
